{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Air bnb | YourRoom</title>
<meta name="description" content="Browse airbnbs by location, name and price." />
<meta property="og:title" content="Air bnb | YourRoom" />
<meta property="og:description" content="Browse airbnbs by location, name and price." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="{% static 'your_room/styles.css' %}" />
</head>
<body>
<main>
  <h1 class="page-title container">Air bnb</h1>
  <form class = "filters container", method = "get", id = "filter-form">
    <select name = "location", class = "filter", onchange="document.getElementById('filter-form').submit()">
      <option value = "">Location</option>
      {% for loc in locations %}
      <option value = "{{ loc }}" {% if request.GET.location == loc %} selected {% endif %}>{{ loc }}</option>
      {% endfor %}
    </select>

  <select name="price" class="filter" onchange="document.getElementById('filter-form').submit()">
    <option value="">Price</option>
    <option value="true" {% if request.GET.self_contained == "true" %}selected{% endif %}>Self contained</option>
    <option value="false" {% if request.GET.self_contained == "false" %}selected{% endif %}>Not self contained</option>
  </select>
  </form>

  <div class="filters container">
    <button class="filter" type="button">Location<img src="{% static 'your_room/images/arrow.png' %}" alt="" /></button>
    <button class="filter" type="button">Name of air bnb<img src="{% static 'your_room/images/arrow.png' %}" alt="" /></button>
    <button class="filter" type="button">Price<img src="{% static 'your_room/images/arrow.png' %}" alt="" /></button>
  </div>
  <div class="grid container">
    <article class="card">
      <img src="{% static 'your_room/images/airbnb.jpg' %}" alt="Name of air bnb" loading="lazy" />
      <h3>Name of air bnb</h3>
      <p>Location</p>
      <div class="card__action"><a class="btn btn--sm" href="detail.html">Details</a></div>
    </article>
    <article class="card">
      <img src="{% static 'your_room/images/airbnb.jpg' %}" alt="Name of air bnb" loading="lazy" />
      <h3>Name of air bnb</h3>
      <p>Location</p>
      <div class="card__action"><a class="btn btn--sm" href="detail.html">Details</a></div>
    </article>
    <article class="card">
      <img src="{% static 'your_room/images/airbnb.jpg' %}" alt="Name of air bnb" loading="lazy" />
      <h3>Name of air bnb</h3>
      <p>Location</p>
      <div class="card__action"><a class="btn btn--sm" href="{% url 'unit-detail' 'airbnb' unit.pk %}">Details</a></div>
    </article>
  </div>
</main>
<footer class="footer container">
  <a class="logo" href="{% url 'index' %}"><b>Your</b><span>Room</span></a>
  <div class="col">
    <strong>Get a Room</strong>
    <a href="{% url 'rentals' %}">Rentals</a>
    <a href="{% url 'hostels' %}">Hostels</a>
    <a href="{% url 'airbnb' %}">Air bnb</a>
  </div>
  <div class="col">
    <strong>Contact us</strong>
    <span>Whatsapp number</span>
    <span>email@gmail.com</span>
  </div>
</footer>
<script src="{% static 'your_room/script.js' %}"></script>
</body>
</html>
